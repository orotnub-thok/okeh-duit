<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - Okeh Duitku</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 pb-12">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-white hover:text-emerald-200"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="font-semibold text-lg">Riwayat Transaksi</h1>
        </div>
        <button id="btnRefresh" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded-lg transition">
            <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
        </button>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- Filter Transaksi -->
        <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Filter Transaksi</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Tahun</label>
                    <select id="filterTahun" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Bulan</label>
                    <select id="filterBulan" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Jenis</label>
                    <select id="filterJenis" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white">
                        <option value="Semua">Semua Jenis</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                        <option value="Transfer">Transfer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Wallet</label>
                    <select id="filterWallet" class="w-full p-2 border rounded-lg text-sm bg-gray-50 focus:bg-white">
                        <option value="Semua">Semua Wallet</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Layout 2 Kolom -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            
            <!-- Kolom 1: Kategori (Lebar 4 Grid) -->
            <div class="md:col-span-4 bg-white p-3 rounded-xl shadow-sm border h-fit">
                <h3 class="font-semibold text-sm text-gray-700 mb-3 border-b pb-2">Kategori</h3>
                <div id="listKategoriSidebar" class="space-y-1">
                    <!-- Item kategori dirender dinamis via JS -->
                </div>
            </div>

            <!-- Kolom 2: Daftar Transaksi Ringkas (Lebar 8 Grid) -->
            <div class="md:col-span-8 bg-white p-4 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center mb-3 border-b pb-2">
                    <h3 class="font-semibold text-sm text-gray-700" id="judulDaftarTransaksi">Daftar Transaksi</h3>
                    <span id="counterTransaksi" class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">0 item</span>
                </div>
                <div id="listTransaksiContainer" class="space-y-2">
                    <!-- List transaksi ringkas dirender dinamis via JS -->
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Detail / Edit / Delete Transaksi -->
    <div id="modalTransaksi" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modalTitle" class="font-bold text-gray-800 text-base">Detail Transaksi</h3>
                <div class="flex items-center space-x-2">
                    <button id="btnModalEdit" class="text-amber-600 hover:text-amber-700 p-1.5 bg-amber-50 rounded-lg text-sm" title="Edit Transaksi">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button id="btnModalDelete" class="text-rose-600 hover:text-rose-700 p-1.5 bg-rose-50 rounded-lg text-sm" title="Hapus Transaksi">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button id="btnModalClose" class="text-gray-400 hover:text-gray-600 p-1.5 ml-2">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Form Detail/Edit -->
            <form id="formDetailTransaksi" class="space-y-3">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Tanggal</label>
                    <input type="date" id="editTanggal" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Jenis</label>
                        <select id="editTipe" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100">
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                            <option value="Transfer">Transfer</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Jumlah (Rp)</label>
                        <input type="number" id="editJumlah" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100">
                    </div>
                </div>
                <div id="wrapperWalletEdit" class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Dari Wallet</label>
                        <select id="editDariWallet" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Ke Wallet</label>
                        <select id="editKeWallet" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Kategori</label>
                    <select id="editKategori" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Catatan</label>
                    <textarea id="editCatatan" rows="2" disabled class="w-full p-2 border rounded-lg text-sm bg-gray-100 disabled:bg-gray-100"></textarea>
                </div>

                <!-- Tombol Simpan (Hanya muncul saat mode edit diaktifkan) -->
                <div id="actionContainer" class="hidden pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg text-sm font-medium transition">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panggil File Konfigurasi & JavaScript Utama -->
    <script src="config.js"></script>
    <script src="riwayat.js"></script>
</body>
</html>
