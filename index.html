<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-emerald-600 mb-2">Okeh Duit</h1>
            <p class="text-sm text-slate-500 mb-6">Masukkan PIN untuk membuka aplikasi</p>
            <input type="password" id="pinInput" maxlength="6" placeholder="******" class="w-full text-center text-2xl tracking-widest border border-slate-300 rounded-lg p-3 mb-4 focus:outline-none focus:border-emerald-500">
            <button onclick="handleLogin()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-lg hover:bg-emerald-700 transition">Masuk</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">PIN Salah!</p>
        </div>
    </div>

    <!-- HALAMAN UTAMA -->
    <div id="mainApp" class="hidden min-h-screen pb-10">
        <!-- Header -->
        <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
            <h1 class="text-lg font-bold">Okeh Duit</h1>
            <button onclick="loadData()" class="text-sm bg-emerald-700 px-3 py-1 rounded hover:bg-emerald-800 transition">Refresh</button>
        </header>

        <!-- Konten Utama -->
        <main class="p-4 max-w-md mx-auto space-y-6">
            
            <!-- Ringkasan Saldo Wallet -->
            <section>
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xs font-bold text-slate-500 tracking-wider">DAFTAR WALLET</h2>
                    <button onclick="openWalletModal()" class="text-xs bg-emerald-600 text-white px-2 py-1 rounded hover:bg-emerald-700">+ Tambah Wallet</button>
                </div>
                <div id="walletList" class="grid grid-cols-2 gap-3"></div>
            </section>

            <!-- Tombol Aksi Transaksi Cepat -->
            <section class="grid grid-cols-3 gap-2">
                <button onclick="openTxModal('Income')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">↙️</span>
                    <span>Pemasukan</span>
                </button>
                <button onclick="openTxModal('Expense')" class="bg-rose-600 hover:bg-rose-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">↗️</span>
                    <span>Pengeluaran</span>
                </button>
                <button onclick="openTxModal('Transfer')" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">🔄</span>
                    <span>Transfer</span>
                </button>
            </section>

            <!-- Riwayat Transaksi -->
            <section>
                <h2 class="text-xs font-bold text-slate-500 tracking-wider mb-3">RIWAYAT TERAKHIR</h2>
                <div id="txHistory" class="space-y-2"></div>
            </section>
        </main>
    </div>

    <!-- MODAL POPUP TRANSAKSI -->
    <div id="txModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="txModalTitle" class="font-bold text-lg text-slate-800">Tambah Transaksi</h3>
                <button onclick="closeTxModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            
            <form id="txForm" onsubmit="submitTransaction(event)" class="space-y-3">
                <input type="hidden" id="txType">

                <div class="grid grid-cols-1 gap-3" id="walletSelectContainer">
                    <div>
                        <label class="text-xs text-slate-500 font-semibold" id="labelDari">Dari Wallet</label>
                        <select id="txFrom" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    </div>
                    <div id="wrapperKe" class="hidden">
                        <label class="text-xs text-slate-500 font-semibold">Ke Wallet</label>
                        <select id="txTo" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    </div>
                </div>

                <div id="wrapperKategori">
                    <div class="flex justify-between items-center">
                        <label class="text-xs text-slate-500 font-semibold">Kategori</label>
                        <button type="button" onclick="openCategoryModal()" class="text-xs text-emerald-600 font-semibold hover:underline">+ Kategori</button>
                    </div>
                    <select id="txCategory" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                </div>

                <div>
                    <label class="text-xs text-slate-500 font-semibold">Jumlah</label>
                    <input type="number" id="txAmount" required placeholder="0" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-500 font-semibold">Catatan (Opsional)</label>
                    <input type="text" id="txNote" placeholder="Misal: Beli kopi" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeTxModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm hover:bg-slate-300 transition">Batal</button>
                    <button type="submit" id="btnSaveTx" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700 transition">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TAMBAH WALLET -->
    <div id="walletModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Tambah Wallet Baru</h3>
            <input type="text" id="newWalletName" placeholder="Nama Wallet (Misal: BCA)" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="newWalletCurrency" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="IDR">IDR (Rupiah)</option>
                <option value="USD">USD (Dolar)</option>
            </select>
            <input type="number" id="newWalletInitial" placeholder="Saldo Awal" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" value="0">
            <div class="flex space-x-2">
                <button onclick="closeWalletModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitNewWallet()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH KATEGORI -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Tambah Kategori Baru</h3>
            <input type="text" id="newCatName" placeholder="Nama Kategori (Misal: Internet)" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="newCatType" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="Expense">Expense (Pengeluaran)</option>
                <option value="Income">Income (Pemasukan)</option>
            </select>
            <div class="flex space-x-2">
                <button onclick="closeCategoryModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitNewCategory()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz2WOpvyd7Y66KzmXYf2g4kDIKYZQVseiYMy0YoNVo5b522-AyvIx-g_oLYnhJy-cql/exec";
        let appData = { wallets: [], categories: [], transactions: [] };

        window.onload = function() {
            if (localStorage.getItem('okeh_logged_in') === 'true') {
                showApp();
            }
        };

        async function handleLogin() {
            const pin = document.getElementById('pinInput').value;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', pin }) });
            const json = await res.json();
            if (json.success) {
                localStorage.setItem('okeh_logged_in', 'true');
                showApp();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadData();
        }

        async function loadData() {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
            const json = await res.json();
            if (json.success) {
                appData = json;
                renderApp();
            }
        }

        function renderApp() {
            // Render Wallets
            const wList = document.getElementById('walletList');
            wList.innerHTML = '';
            appData.wallets.forEach(w => {
                const saldo = Number(w['SaldoAkhir'] || 0).toLocaleString('id-ID');
                wList.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <div class="text-xs text-slate-400 font-medium">${w['Nama Wallet']} (${w['Mata Uang']})</div>
                        <div class="text-base font-bold text-slate-800">${w['Mata Uang'] === 'USD' ? '$' : 'Rp'} ${saldo}</div>
                    </div>
                `;
            });

            // Populate Wallet Options
            const selFrom = document.getElementById('txFrom');
            const selTo = document.getElementById('txTo');
            selFrom.innerHTML = ''; selTo.innerHTML = '';
            appData.wallets.forEach(w => {
                selFrom.innerHTML += `<option value="${w['Nama Wallet']}">${w['Nama Wallet']}</option>`;
                selTo.innerHTML += `<option value="${w['Nama Wallet']}">${w['Nama Wallet']}</option>`;
            });

            // Render Transactions History
            const historyEl = document.getElementById('txHistory');
            historyEl.innerHTML = '';
            [...appData.transactions].reverse().slice(0, 10).forEach(t => {
                const jumlahFmt = Number(t['Jumlah'] || 0).toLocaleString('id-ID');
                const isIncome = t['Tipe'] === 'Income';
                const isTransfer =
