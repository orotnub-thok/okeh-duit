<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h1 class="text-2xl font-bold text-emerald-600 mb-2">Okeh Duit</h1>
            <p class="text-sm text-slate-500 mb-6">Masukkan PIN untuk membuka aplikasi</p>
            <input type="password" id="pinInput" maxlength="6" placeholder="******" class="w-full text-center text-2xl tracking-widest border border-slate-300 rounded-lg p-3 mb-4 focus:outline-none focus:border-emerald-500">
            <button onclick="handleLogin()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-lg hover:bg-emerald-700 transition">Masuk</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">PIN Salah!</p>
        </div>
    </div>

    <!-- HALAMAN UTAMA -->
    <div id="mainApp" class="hidden min-h-screen pb-10">
        <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
            <h1 class="text-lg font-bold">Okeh Duit</h1>
            <button onclick="loadData()" class="text-sm bg-emerald-700 px-3 py-1 rounded hover:bg-emerald-800 transition">Refresh</button>
        </header>

        <main class="p-4 max-w-md mx-auto space-y-6">
            
            <!-- Ringkasan Saldo Berdasarkan Mata Uang -->
            <section>
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xs font-bold text-slate-500 tracking-wider">TOTAL SALDO</h2>
                    <div class="space-x-1">
                        <button onclick="openCategoryManagerModal()" class="text-xs bg-slate-600 text-white px-2 py-1 rounded hover:bg-slate-700">Kelola Kategori</button>
                        <button onclick="openWalletModal()" class="text-xs bg-emerald-600 text-white px-2 py-1 rounded hover:bg-emerald-700">+ Wallet</button>
                    </div>
                </div>
                <div id="currencySummaryList" class="grid grid-cols-2 gap-3"></div>
            </section>

            <!-- Tombol Aksi Transaksi Cepat -->
            <section class="grid grid-cols-3 gap-2">
                <button onclick="openTxModal('Income')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">↙️</span>
                    <span>Pemasukan</span>
                </button>
                <button onclick="openTxModal('Expense')" class="bg-rose-600 hover:bg-rose-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">↗️</span>
                    <span>Pengeluaran</span>
                </button>
                <button onclick="openTxModal('Transfer')" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-2 rounded-xl font-semibold text-sm shadow-sm flex flex-col items-center justify-center transition">
                    <span class="text-lg mb-1">🔄</span>
                    <span>Transfer</span>
                </button>
            </section>

            <!-- Riwayat Transaksi -->
            <section>
                <h2 class="text-xs font-bold text-slate-500 tracking-wider mb-3">RIWAYAT TERAKHIR</h2>
                <div id="txHistory" class="space-y-2"></div>
            </section>
        </main>
    </div>

    <!-- MODAL RINCIAN WALLET -->
    <div id="walletDetailModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="walletDetailTitle" class="font-bold text-lg text-slate-800">Rincian Wallet</h3>
                <button onclick="closeWalletDetailModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            <div id="walletDetailContent" class="space-y-3 max-h-60 overflow-y-auto"></div>
            <button onclick="closeWalletDetailModal()" class="w-full bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Tutup</button>
        </div>
    </div>

    <!-- MODAL EDIT WALLET -->
    <div id="editWalletModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Edit Wallet</h3>
            <input type="hidden" id="editWalletId">
            <div>
                <label class="text-xs text-slate-500 font-semibold">Nama Wallet</label>
                <input type="text" id="editWalletName" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-500 font-semibold">Mata Uang</label>
                <select id="editWalletCurrency" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="IDR">IDR (Rupiah)</option>
                    <option value="USD">USD (Dolar)</option>
                </select>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditWalletModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitEditWallet()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL KELOLA KATEGORI -->
    <div id="categoryManagerModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-slate-800">Daftar Kategori</h3>
                <button onclick="closeCategoryManagerModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            <button onclick="openCategoryModal()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700">+ Tambah Kategori</button>
            <div id="categoryListContent" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <button onclick="closeCategoryManagerModal()" class="w-full bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Tutup</button>
        </div>
    </div>

    <!-- MODAL EDIT KATEGORI -->
    <div id="editCategoryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Edit Kategori</h3>
            <input type="hidden" id="editCatId">
            <div>
                <label class="text-xs text-slate-500 font-semibold">Nama Kategori</label>
                <input type="text" id="editCatName" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-500 font-semibold">Tipe</label>
                <select id="editCatType" class="w-full border p-2 rounded-lg text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="Expense">Expense (Pengeluaran)</option>
                    <option value="Income">Income (Pemasukan)</option>
                </select>
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="closeEditCategoryModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitEditCategory()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL TRANSAKSI -->
    <div id="txModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="txModalTitle" class="font-bold text-lg text-slate-800">Tambah Transaksi</h3>
                <button onclick="closeTxModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            <form id="txForm" onsubmit="submitTransaction(event)" class="space-y-3">
                <input type="hidden" id="txType">
                <div>
                    <label class="text-xs text-slate-500 font-semibold" id="labelDari">Dari Wallet</label>
                    <select id="txFrom" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                </div>
                <div id="wrapperKe" class="hidden">
                    <label class="text-xs text-slate-500 font-semibold">Ke Wallet</label>
                    <select id="txTo" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                </div>
                <div id="wrapperKategori">
                    <label class="text-xs text-slate-500 font-semibold">Kategori</label>
                    <select id="txCategory" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                </div>
                <div>
                    <label class="text-xs text-slate-500 font-semibold">Jumlah</label>
                    <input type="number" id="txAmount" required placeholder="0" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500 font-semibold">Catatan (Opsional)</label>
                    <input type="text" id="txNote" placeholder="Misal: Beli kopi" class="w-full border rounded-lg p-2 text-sm bg-slate-50 mt-1 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="closeTxModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                    <button type="submit" id="btnSaveTx" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TAMBAH WALLET -->
    <div id="walletModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Tambah Wallet Baru</h3>
            <input type="text" id="newWalletName" placeholder="Nama Wallet (Misal: BCA)" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="newWalletCurrency" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="IDR">IDR (Rupiah)</option>
                <option value="USD">USD (Dolar)</option>
            </select>
            <input type="number" id="newWalletInitial" placeholder="Saldo Awal" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" value="0">
            <div class="flex space-x-2">
                <button onclick="closeWalletModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitNewWallet()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH KATEGORI -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-bold text-lg text-slate-800">Tambah Kategori Baru</h3>
            <input type="text" id="newCatName" placeholder="Nama Kategori (Misal: Internet)" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <select id="newCatType" class="w-full border p-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <option value="Expense">Expense (Pengeluaran)</option>
                <option value="Income">Income (Pemasukan)</option>
            </select>
            <div class="flex space-x-2">
                <button onclick="closeCategoryModal()" class="w-1/2 bg-slate-200 text-slate-700 font-semibold py-2 rounded-lg text-sm">Batal</button>
                <button onclick="submitNewCategory()" class="w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm hover:bg-emerald-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz0CKskSJMt4Q9zXIU7qEUJ7XiQfF-J4ohbb1D2izU9ArXoR4jNBiPUiEthVaGnEQ8/exec";
        let appData = { wallets: [], categories: [], transactions: [] };

        window.onload = function() {
            if (localStorage.getItem('okeh_logged_in') === 'true') {
                showApp();
            }
        };

        async function handleLogin() {
            const pin = document.getElementById('pinInput').value;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', pin }) });
            const json = await res.json();
            if (json.success) {
                localStorage.setItem('okeh_logged_in', 'true');
                showApp();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function showApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadData();
        }

        async function loadData() {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData' }) });
            const json = await res.json();
            if (json.success) {
                appData = json;
                renderApp();
            }
        }

        function renderApp() {
            const currencyTotals = {};
            const currencyWallets = {};

            appData.wallets.forEach(w => {
                const curr = w['Mata Uang'] || 'IDR';
                const saldo = Number(w['SaldoAkhir'] || 0);
                if (!currencyTotals[curr]) {
                    currencyTotals[curr] = 0;
                    currencyWallets[curr] = [];
                }
                currencyTotals[curr] += saldo;
                currencyWallets[curr].push(w);
            });

            const summaryList = document.getElementById('currencySummaryList');
            summaryList.innerHTML = '';

            for (const [curr, total] of Object.entries(currencyTotals)) {
                const totalFmt = total.toLocaleString('id-ID');
                const symbol = curr === 'USD' ? '$' : 'Rp';
                summaryList.innerHTML += `
                    <div onclick="openWalletDetail('${curr}')" class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 cursor-pointer hover:border-emerald-500 transition">
                        <div class="text-xs text-slate-400 font-medium">Total (${curr})</div>
                        <div class="text-base font-bold text-slate-800">${symbol} ${totalFmt}</div>
                        <div class="text-[10px] text-emerald-600 mt-1 font-medium">Ketuk rincian &rarr;</div>
                    </div>
                `;
            }

            window.currencyWalletsData = currencyWallets;

            const selFrom = document.getElementById('txFrom');
            const selTo = document.getElementById('txTo');
            selFrom.innerHTML = ''; selTo.innerHTML = '';
            appData.wallets.forEach(w => {
                selFrom.innerHTML += `<option value="${w['Nama Wallet']}">${w['Nama Wallet']}</option>`;
                selTo.innerHTML += `<option value="${w['Nama Wallet']}">${w['Nama Wallet']}</option>`;
            });

            const historyEl = document.getElementById('txHistory');
            historyEl.innerHTML = '';
            [...appData.transactions].reverse().slice(0, 10).forEach(t => {
                const jumlahFmt = Number(t['Jumlah'] || 0).toLocaleString('id-ID');
                const isIncome = t['Tipe'] === 'Income';
                const isTransfer = t['Tipe'] === 'Transfer';
                let colorClass = 'text-rose-600', sign = '-';
                if (isIncome) { colorClass = 'text-emerald-600'; sign = '+'; }
                if (isTransfer) { colorClass = 'text-blue-600'; sign = '•'; }

                historyEl.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center text-sm">
                        <div>
                            <div class="font-bold text-slate-700">${t['Kategori'] || t['Tipe']}</div>
                            <div class="text-xs text-slate-400">${t['Tanggal']} • ${t['Catatan'] || '-'}</div>
                        </div>
                        <div class="font-semibold ${colorClass}">${sign} Rp ${jumlahFmt}</div>
                    </div>
                `;
            });
        }

        function openWalletDetail(curr) {
            document.getElementById('walletDetailTitle').innerText = `Rincian Wallet (${curr})`;
            const contentEl = document.getElementById('walletDetailContent');
            contentEl.innerHTML = '';

            const wallets = window.currencyWalletsData[curr] || [];
            wallets.forEach(w => {
                const saldo = Number(w['SaldoAkhir'] || 0).toLocaleString('id-ID');
                const symbol = curr === 'USD' ? '$' : 'Rp';
                contentEl.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border">
                        <div>
                            <div class="font-bold text-sm text-slate-700">${w['Nama Wallet']}</div>
                            <div class="text-xs text-slate-500">${symbol} ${saldo}</div>
                        </div>
                        <div class="space-x-1">
                            <button onclick="openEditWallet('${w['Wallet ID']}', '${w['Nama Wallet']}', '${w['Mata Uang']}')" class="text-xs bg-amber-500 text-white px-2 py-1 rounded">Ubah</button>
                            <button onclick="deleteWallet('${w['Wallet ID']}')" class="text-xs bg-rose-500 text-white px-2 py-1 rounded">Hapus</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('walletDetailModal').classList.remove('hidden');
        }
        function closeWalletDetailModal() { document.getElementById('walletDetailModal').classList.add('hidden'); }

        function openEditWallet(id, name, currency) {
            document.getElementById('editWalletId').value = id;
            document.getElementById('editWalletName').value = name;
            document.getElementById('editWalletCurrency').value = currency;
            document.getElementById('editWalletModal').classList.remove('hidden');
        }
        function closeEditWalletModal() { document.getElementById('editWalletModal').classList.add('hidden'); }

        async function submitEditWallet() {
            const id = document.getElementById('editWalletId').value;
            const name = document.getElementById('editWalletName').value;
            const currency = document.getElementById('editWalletCurrency').value;
            
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'editWallet', id, name, currency }) });
            const json = await res.json();
            if (json.success) { closeEditWalletModal(); closeWalletDetailModal(); loadData(); } else { alert(json.message); }
        }

        async function deleteWallet(id) {
            if (!confirm('Yakin ingin menghapus wallet ini?')) return;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteWallet', id }) });
            const json = await res.json();
            if (json.success) { closeWalletDetailModal(); loadData(); } else { alert(json.message); }
        }

        function openCategoryManagerModal() {
            const content = document.getElementById('categoryListContent');
            content.innerHTML = '';
            appData.categories.forEach(c => {
                content.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-sm">
                        <div>
                            <span class="font-bold text-slate-700">${c['Nama Kategori']}</span>
                            <span class="text-xs text-slate-400 ml-2">(${c['Tipe']})</span>
                        </div>
                        <div class="space-x-1">
                            <button onclick="openEditCategory('${c['Category ID']}', '${c['Nama Kategori']}', '${c['Tipe']}')" class="text-xs bg-amber-500 text-white px-2 py-1 rounded">Ubah</button>
                            <button onclick="deleteCategory('${c['Category ID']}')" class="text-xs bg-rose-500 text-white px-2 py-1 rounded">Hapus</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('categoryManagerModal').classList.remove('hidden');
        }
        function closeCategoryManagerModal() { document.getElementById('categoryManagerModal').classList.add('hidden'); }

        function openEditCategory(id, name, type) {
            document.getElementById('editCatId').value = id;
            document.getElementById('editCatName').value = name;
            document.getElementById('editCatType').value = type;
            document.getElementById('editCategoryModal').classList.remove('hidden');
        }
        function closeEditCategoryModal() { document.getElementById('editCategoryModal').classList.add('hidden'); }

        async function submitEditCategory() {
            const id = document.getElementById('editCatId').value;
            const name = document.getElementById('editCatName').value;
            const type = document.getElementById('editCatType').value;

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'editCategory', id, name, type }) });
            const json = await res.json();
            if (json.success) { closeEditCategoryModal(); closeCategoryManagerModal(); loadData(); } else { alert(json.message); }
        }

        async function deleteCategory(id) {
            if (!confirm('Yakin ingin menghapus kategori ini?')) return;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteCategory', id }) });
            const json = await res.json();
            if (json.success) { closeCategoryManagerModal(); loadData(); } else { alert(json.message); }
        }

        function openTxModal(type) {
            document.getElementById('txType').value = type;
            const modalTitle = document.getElementById('txModalTitle');
            const btnSave = document.getElementById('btnSaveTx');
            const wrapperKe = document.getElementById('wrapperKe');
            const wrapperKategori = document.getElementById('wrapperKategori');
            const labelDari = document.getElementById('labelDari');
            const catSelect = document.getElementById('txCategory');

            if (type === 'Income') {
                modalTitle.innerText = 'Tambah Pemasukan';
                btnSave.className = 'w-1/2 bg-emerald-600 text-white font-semibold py-2 rounded-lg text-sm';
                labelDari.innerText = 'Ke Wallet (Tujuan)';
                wrapperKe.classList.add('hidden');
                wrapperKategori.classList.remove('hidden');
            } else if (type === 'Expense') {
                modalTitle.innerText = 'Tambah Pengeluaran';
                btnSave.className = 'w-1/2 bg-rose-600 text-white font-semibold py-2 rounded-lg text-sm';
                labelDari.innerText = 'Dari Wallet (Sumber)';
                wrapperKe.classList.add('hidden');
                wrapperKategori.classList.remove('hidden');
            } else if (type === 'Transfer') {
                modalTitle.innerText = 'Transfer Antar Wallet';
                btnSave.className = 'w-1/2 bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm';
                labelDari.innerText = 'Dari Wallet';
                wrapperKe.classList.remove('hidden');
                wrapperKategori.classList.add('hidden');
            }

            if (type !== 'Transfer') {
                catSelect.innerHTML = '';
                appData.categories.filter(c => c['Tipe'] === type).forEach(c => {
                    catSelect.innerHTML += `<option value="${c['Nama Kategori']}">${c['Nama Kategori']}</option>`;
                });
            }

            document.getElementById('txModal').classList.remove('hidden');
        }

        function closeTxModal() { document.getElementById('txModal').classList.add('hidden'); document.getElementById('txAmount').value = ''; document.getElementById('txNote').value = ''; }
        function openWalletModal() { document.getElementById('walletModal').classList.remove('hidden'); }
        function closeWalletModal() { document.getElementById('walletModal').classList.add('hidden'); }
        function openCategoryModal() { document.getElementById('categoryModal').classList.remove('hidden'); }
        function closeCategoryModal() { document.getElementById('categoryModal').classList.add('hidden'); }

        async function submitTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('txType').value;
            const data = {
                action: 'addTransaction',
                tipe: type,
                dariWallet: document.getElementById('txFrom').value,
                keWallet: type === 'Transfer' ? document.getElementById('txTo').value : '',
                kategori: type === 'Transfer' ? 'Transfer' : document.getElementById('txCategory').value,
                jumlah: document.getElementById('txAmount').value,
                catatan: document.getElementById('txNote').value,
                tanggal: new Date().toISOString().split('T')[0]
            };

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
            const json = await res.json();
            if (json.success) { closeTxModal(); loadData(); } else { alert('Gagal: ' + json.message); }
        }

        async function submitNewWallet() {
            const name = document.getElementById('newWalletName').value;
            const currency = document.getElementById('newWalletCurrency').value;
            const initial = document.getElementById('newWalletInitial').value;
            if (!name) return alert('Nama wallet wajib diisi');

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addWallet', name, currency, initial }) });
            const json = await res.json();
            if (json.success) { closeWalletModal(); loadData(); } else { alert(json.message); }
        }

        async function submitNewCategory() {
            const name = document.getElementById('newCatName').value;
            const type = document.getElementById('newCatType').value;
            if (!name) return alert('Nama kategori wajib diisi');

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addCategory', name, type }) });
            const json = await res.json();
            if (json.success) { closeCategoryModal(); loadData(); } else { alert(json.message); }
        }
    </script>
</body>
</html>
